<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💕</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffb6c1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #d63384;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .card {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #c2185b;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #ff8da1;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            color: #880e4f;
            background-color: #fff0f5;
        }

        input[type="text"]:focus {
            border-color: #d63384;
        }

        .btn-submit {
            margin-top: 1.2rem;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 1.5rem;
            position: relative;
            min-height: 50px;
        }

        .btn-choice {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yes-btn {
            background-color: #2e7d32;
            color: white;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
            z-index: 2;
        }

        #no-btn {
            background-color: #d32f2f;
            color: white;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
            position: absolute;
            transition: left 0.2s ease, top 0.2s ease;
            touch-action: manipulation;
        }

        .love-text {
            font-size: 2.2rem;
            font-weight: 800;
            color: #d81b60;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="card">
        <div id="step-1">
            <h2>Как тебя зовут?</h2>
            <form onsubmit="handleStep1(event)">
                <input type="text" id="name-input" required autocomplete="off">
                <br>
                <button type="submit" class="btn-submit">Далее</button>
            </form>
        </div>

        <div id="step-2" class="hidden">
            <h2>Какое сегодня число?</h2>
            <form onsubmit="handleStep2(event)">
                <input type="text" id="date-input" required autocomplete="off">
                <br>
                <button type="submit" class="btn-submit">Далее</button>
            </form>
        </div>

        <div id="step-3" class="hidden">
            <h2>Давай встречаться? 💖</h2>
            <div class="buttons-container" id="btn-container">
                <button id="yes-btn" class="btn-choice" onclick="handleYes()">Да</button>
                <button id="no-btn" class="btn-choice">Нет</button>
            </div>
        </div>

        <div id="step-4" class="hidden">
            <h1 class="love-text">Я тебя Люблю! ❤️</h1>
        </div>
    </div>

    <script>
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const step4 = document.getElementById('step-4');
        const noBtn = document.getElementById('no-btn');
        const container = document.getElementById('btn-container');

        function handleStep1(e) {
            e.preventDefault();
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
        }

        function handleStep2(e) {
            e.preventDefault();
            step2.classList.add('hidden');
            step3.classList.remove('hidden');
            initNoButtonPosition();
        }

        function initNoButtonPosition() {
            noBtn.style.position = 'relative';
            noBtn.style.left = '0px';
            noBtn.style.top = '0px';
        }

        function moveNoButton() {
            const card = document.querySelector('.card');
            const cardRect = card.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            const maxX = cardRect.width - btnRect.width - 40;
            const maxY = cardRect.height - btnRect.height - 40;

            const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
            const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

            noBtn.style.position = 'absolute';
            noBtn.style.left = `calc(50% + ${randomX}px)`;
            noBtn.style.top = `calc(50% + ${randomY}px)`;
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function handleYes() {
            step3.classList.add('hidden');
            step4.classList.remove('hidden');
            startFireworks();
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.friction = 0.96;
                this.gravity = 0.15;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.015;
            }
        }

        function createExplosion(x, y) {
            const colors = ['#ff4081', '#ff8da1', '#ffffff', '#ffd700', '#ff1744'];
            for (let i = 0; i < 60; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animateFireworks);
        }

        function startFireworks() {
            animateFireworks();
            const interval = setInterval(() => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.6);
                createExplosion(x, y);
            }, 400);

            setTimeout(() => clearInterval(interval), 10000);
        }
    </script>
</body>
</html>
